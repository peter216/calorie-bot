<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortcuts</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #142033;
      --muted: #56627a;
      --line: #d9e1ef;
      --button: #1060ff;
      --button-hover: #0c4dd4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 48%, #eaf0fa 100%);
      color: var(--text);
    }

    .page {
      width: min(860px, 92vw);
      margin: 48px auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 2vw + 1rem, 2.6rem);
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .shortcut {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 8px 24px rgba(16, 40, 80, 0.06);
    }

    .shortcut h2 {
      margin: 0 0 10px;
      font-size: 1.15rem;
    }

    .shortcut p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.45;
    }

    .button {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      background: var(--button);
      color: #fff;
      font-weight: 600;
    }

    .button:hover {
      background: var(--button-hover);
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Shortcuts</h1>
    <p class="intro">Log Calories Shortcut</p>

    <section class="shortcuts">
      <article class="shortcut">
        <h2>Log Calories</h2>
        <p>Log your daily calories with this shortcut.</p>
        <a class="button" href="https://www.icloud.com/shortcuts/817b7aaa42264e13ad9bc4321c370f9b" aria-label="Log Calories">Get Shortcut</a>
      </article>

  </main>
</body>
</html>
